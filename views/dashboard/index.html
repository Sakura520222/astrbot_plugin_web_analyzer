<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>网页截图插件</title>
  <link rel="icon" href="./logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar" aria-label="主导航">
      <div class="sidebar-header">
        <img class="sidebar-logo" src="./logo.svg" alt="" />
        <div class="sidebar-title" id="sidebar-title" data-i18n="nav.title">网页截图插件</div>
      </div>
      <nav class="nav-list" aria-label="页面">
        <button class="nav-item active" type="button" data-page="overview" aria-current="page"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zm10 7h6V11h-6zm0-16v3h6V4zM4 20h6v-3H4z"/></svg><span class="nav-text" data-i18n="nav.overview">截图概览</span></button>
        <button class="nav-item" type="button" data-page="cache"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zm3 3v2h10V8zm0 5v2h7v-2z"/></svg><span class="nav-text" data-i18n="nav.cache">截图缓存</span></button>
        <button class="nav-item" type="button" data-page="rules"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v5c0 5 3.4 8.5 8 10 4.6-1.5 8-5 8-10V6zm0 4 4 1.5V11c0 3-1.5 5.2-4 6.5-2.5-1.3-4-3.5-4-6.5V8.5z"/></svg><span class="nav-text" data-i18n="nav.rules">访问规则</span></button>
        <button class="nav-item" type="button" data-page="diagnostics"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 9 9 0 0 0-9-9m6.8 6h-4a13 13 0 0 0-1.4-3.7A7.1 7.1 0 0 1 18.8 9M12 5c1 1.2 1.7 2.5 2 4h-4c.3-1.5 1-2.8 2-4M5.2 15a7 7 0 0 1 0-6h4a14 14 0 0 0 0 6zm.9 2h4a13 13 0 0 0 1.4 3.7A7.1 7.1 0 0 1 6.1 17M10 11h4a11 11 0 0 1 0 2h-4a11 11 0 0 1 0-2m2 8c-1-1.2-1.7-2.5-2-4h4c-.3 1.5-1 2.8-2 4m1.4 1.7a13 13 0 0 0 1.4-3.7h4a7.1 7.1 0 0 1-5.4 3.7M14.8 15a14 14 0 0 0 0-6h4a7 7 0 0 1 0 6z"/></svg><span class="nav-text" data-i18n="nav.diagnostics">浏览器诊断</span></button>
      </nav>
      <div class="sidebar-footer"><span class="version-info" id="version-info">v2.0.0</span></div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <h1 class="page-title" id="page-title">截图概览</h1>
        <button class="btn btn-icon" id="btn-refresh" type="button" aria-label="刷新当前页面" title="刷新"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.7 6.3A8 8 0 0 0 4.2 9H2l3.5 3.5L9 9H6.3a6 6 0 0 1 10.2-1.3L17.7 6.3zM18.5 11 15 14.5h2.7a6 6 0 0 1-10.2 1.3l-1.2 1.4A8 8 0 0 0 19.8 15H22z"/></svg></button>
      </header>

      <section class="page active" id="page-overview" aria-labelledby="page-title">
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-info"><div class="stat-value" id="stat-cache-total">-</div><div class="stat-label" data-i18n="overview.cacheTotal">缓存总数</div></div></div>
          <div class="stat-card"><div class="stat-info"><div class="stat-value" id="stat-cache-valid">-</div><div class="stat-label" data-i18n="overview.cacheValid">有效缓存</div></div></div>
          <div class="stat-card"><div class="stat-info"><div class="stat-value" id="stat-cache-expired">-</div><div class="stat-label" data-i18n="overview.cacheExpired">过期缓存</div></div></div>
          <div class="stat-card"><div class="stat-info"><div class="stat-value" id="stat-browser">-</div><div class="stat-label" data-i18n="overview.browser">系统浏览器</div></div></div>
        </div>
        <div class="card-grid">
          <section class="card"><div class="card-header"><h2 data-i18n="overview.autoStatus">自动截图</h2></div><div class="card-body" id="auto-status" aria-live="polite"><div class="loading-spinner" role="status" aria-label="加载中"></div></div></section>
          <section class="card"><div class="card-header"><h2 data-i18n="overview.captureParams">截图参数</h2></div><div class="card-body" id="capture-params" aria-live="polite"><div class="loading-spinner" role="status" aria-label="加载中"></div></div></section>
        </div>
      </section>

      <section class="page" id="page-cache" aria-labelledby="page-title">
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-info"><div class="stat-value" id="cache-total">-</div><div class="stat-label" data-i18n="cache.total">缓存总数</div></div></div>
          <div class="stat-card"><div class="stat-info"><div class="stat-value" id="cache-valid">-</div><div class="stat-label" data-i18n="cache.valid">有效缓存</div></div></div>
          <div class="stat-card"><div class="stat-info"><div class="stat-value" id="cache-expired">-</div><div class="stat-label" data-i18n="cache.expired">过期缓存</div></div></div>
          <button class="stat-card stat-card-action" id="card-clear-cache" type="button"><span class="stat-info"><span class="stat-value">清空</span><span class="stat-label" data-i18n="cache.clearAll">清空缓存</span></span></button>
        </div>
        <section class="card"><div class="card-header"><h2 data-i18n="cache.cacheList">缓存列表</h2><input type="search" class="search-input" id="cache-search" aria-label="搜索缓存 URL" data-i18n-placeholder="cache.searchPlaceholder" placeholder="搜索 URL..." /></div><div class="card-body"><div class="table-container"><table class="data-table"><thead><tr><th>#</th><th data-i18n="cache.tableUrl">URL</th><th data-i18n="cache.tableTitle">标题</th><th data-i18n="cache.tableStatus">状态</th><th data-i18n="cache.tableTime">缓存时间</th><th data-i18n="cache.tableAction">操作</th></tr></thead><tbody id="cache-table-body"><tr><td colspan="6" class="empty-state" data-i18n="cache.loading">加载中...</td></tr></tbody></table></div></div></section>
      </section>

      <section class="page" id="page-rules" aria-labelledby="page-title"><div class="card-grid">
        <section class="card"><div class="card-header"><h2 data-i18n="rules.allowed">允许的域名</h2></div><div class="card-body"><div class="tag-list" id="allowed-domains-list"><div class="loading-spinner" role="status" aria-label="加载中"></div></div></div></section>
        <section class="card"><div class="card-header"><h2 data-i18n="rules.blocked">禁止的域名</h2></div><div class="card-body"><div class="tag-list" id="blocked-domains-list"><div class="loading-spinner" role="status" aria-label="加载中"></div></div></div></section>
      </div>
      <div class="card-grid" style="margin-top: 18px;">
        <section class="card"><div class="card-header"><h2 data-i18n="rules.groups">群聊黑名单</h2></div><div class="card-body"><div class="tag-list" id="group-blacklist-list"><div class="loading-spinner" role="status" aria-label="加载中"></div></div></div></section>
        <section class="card"><div class="card-header"><h2 data-i18n="rules.nativeEntry">修改规则</h2></div><div class="card-body"><p class="help-text" data-i18n="rules.nativeHint">访问规则在插件配置中维护：打开 WebUI「插件管理 → 网页截图插件 → 配置」，编辑「访问规则」分组后保存即可生效。</p></div></section>
      </div></section>

      <section class="page" id="page-diagnostics" aria-labelledby="page-title">
        <section class="card"><div class="card-header"><h2 data-i18n="diagnostics.title">系统浏览器状态</h2>
          <div style="display:flex; gap:8px;">
            <button class="btn btn-secondary btn-sm" id="btn-recheck" type="button" data-i18n="diagnostics.recheck">重新检测</button>
            <button class="btn btn-secondary btn-sm" id="btn-refresh-browser" type="button" data-i18n="diagnostics.refresh">刷新状态</button>
          </div></div><div class="card-body" id="browser-status" aria-live="polite"><div class="loading-spinner" role="status" aria-label="加载中"></div></div></section>
        <section class="card browser-actions"><div class="card-header"><h2 data-i18n="diagnostics.legacy">旧版残留</h2></div><div class="card-body" id="legacy-status"><div class="loading-spinner" role="status" aria-label="加载中"></div></div><div class="card-body" style="padding-top: 0;"><button class="btn btn-danger" id="btn-uninstall-browser" type="button" data-i18n="diagnostics.cleanup">清理旧版残留</button><p class="help-text" data-i18n="diagnostics.cleanupHint">清理旧版本通过 Playwright 下载的浏览器残留文件；当前版本直接使用系统已安装的浏览器，无需下载。</p></div></section>
      </section>
      <div class="toast-container" id="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>
      <div class="confirm-overlay" id="confirm-overlay" hidden>
        <div class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-message">
          <p id="confirm-message"></p>
          <div class="confirm-actions">
            <button class="btn" id="btn-confirm-cancel" type="button" data-i18n="confirm.cancel">取消</button>
            <button class="btn btn-danger" id="btn-confirm-ok" type="button" data-i18n="confirm.ok">确认</button>
          </div>
        </div>
      </div>
      <div class="preview-overlay" id="preview-overlay" hidden>
        <div class="preview-dialog" role="dialog" aria-modal="true" aria-label="截图预览">
          <button class="btn btn-icon preview-close" id="btn-preview-close" type="button" aria-label="关闭预览"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8.4 7 5.6 5.6L19.6 7 21 8.4 15.4 14l5.6 5.6-1.4 1.4-5.6-5.6L8.4 21 7 19.6 12.6 14 7 8.4 8.4 7z" transform="translate(-1 -1)"/></svg></button>
          <img id="preview-image" alt="截图预览" />
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
